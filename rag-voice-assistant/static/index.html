<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campaign Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1a1a2e;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; color: #a78bfa; }
    header span { font-size: 0.8rem; color: #6b7280; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background: #4c1d95;
      color: #f3f4f6;
      border-bottom-right-radius: 2px;
    }
    .assistant {
      align-self: flex-start;
      background: #1e1e3a;
      color: #e5e7eb;
      border-bottom-left-radius: 2px;
      border: 1px solid #2a2a4a;
    }
    .sources {
      font-size: 0.75rem;
      color: #a78bfa;
      margin-top: 6px;
    }
    #controls {
      padding: 16px 24px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #text-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f0f1a;
      color: #f0f0f0;
      font-size: 0.95rem;
      outline: none;
    }
    #text-input:focus { border-color: #a78bfa; }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    #send-btn {
      background: #7c3aed;
      color: white;
    }
    #send-btn:hover { background: #6d28d9; }
    #mic-btn {
      background: #1e1e3a;
      color: #a78bfa;
      border: 1px solid #2a2a4a;
      font-size: 1.2rem;
    }
    #mic-btn.recording {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #dc2626;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .typing {
      align-self: flex-start;
      background: #1e1e3a;
      border: 1px solid #2a2a4a;
      padding: 12px 16px;
      border-radius: 12px;
      color: #6b7280;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🎙️ Campaign Voice Assistant</h1>
    <span>Ask about schemes, candidates, and policies</span>
  </div>
</header>

<div id="chat">
  <div class="message assistant">
    Hello! I'm your campaign assistant. Ask me about schemes, candidates, or policies — or press the mic button to speak.
  </div>
</div>

<div id="controls">
  <input id="text-input" type="text" placeholder="Type your question or press mic to speak..." />
  <button id="mic-btn" title="Hold to record">🎙️</button>
  <button id="send-btn">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const textInput = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');

  let mediaRecorder, audioChunks = [];

  function addMessage(text, role, sources = []) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = text;
    if (sources.length > 0) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.textContent = '📄 Sources: ' + sources.join(', ');
      div.appendChild(s);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.textContent = 'Thinking...';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendText(query) {
    if (!query.trim()) return;
    addMessage(query, 'user');
    textInput.value = '';
    addTyping();

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, top_k: 3 })
      });
      const data = await res.json();
      removeTyping();
      const msg = addMessage(data.answer, 'assistant', data.sources);

      // Speak the response
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(data.answer);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    } catch (err) {
      removeTyping();
      addMessage('Error connecting to server.', 'assistant');
    }
  }

  async function sendAudio(blob) {
    addMessage('🎙️ Voice message sent...', 'user');
    addTyping();

    const formData = new FormData();
    formData.append('file', blob, 'recording.webm');

    try {
      const res = await fetch('/voice-query', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      removeTyping();

      // Show transcript
      addMessage(`🎙️ "${data.transcript}"`, 'user');

      // Show answer
      addMessage(data.answer, 'assistant', data.sources);

      // Play audio response
      if (data.audio_url) {
        const audio = new Audio(data.audio_url);
        audio.play();
      }
    } catch (err) {
      removeTyping();
      addMessage('Error processing voice.', 'assistant');
    }
  }

  // Send on button click
  sendBtn.addEventListener('click', () => sendText(textInput.value));

  // Send on Enter
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendText(textInput.value);
  });

  // Mic recording
  micBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙️';
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      sendAudio(blob);
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
  });
</script>

</body>
</html>
